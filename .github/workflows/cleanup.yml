name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Number of recent runs to keep"
        required: false
        default: "10"
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep_count || '10' }}
        run: |
          echo "Keeping last $KEEP runs per workflow..."
          workflows=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id')
          for wf_id in $workflows; do
            wf_name=$(gh api repos/${{ github.repository }}/actions/workflows/$wf_id --jq '.name')
            echo "=== Processing: $wf_name ==="
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf_id/runs?per_page=100&status=completed,neutral,success,failure,cancelled,skipped,stale" --jq '.workflow_runs[].id')
            count=0
            for run_id in $runs; do
              count=$((count + 1))
              if [ $count -le $KEEP ]; then
                continue
              fi
              echo "Deleting run #$count (ID: $run_id)"
              gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id || true
            done
            echo "Deleted $(( count > KEEP ? count - KEEP : 0 )) runs from $wf_name"
          done
          echo "Cleanup complete!"
