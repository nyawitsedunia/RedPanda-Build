name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Number of recent runs to keep"
        required: false
        default: "10"
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: ${{ github.event.inputs.keep_count || '10' }}
