name: Build RedPanda GKI Kernel

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Select build variant"
        required: true
        default: "ReSukiSU"
        type: choice
        options:
          - ReSukiSU
          - none
      clang_choice:
        description: "Select Clang toolchain"
        required: true
        default: "Neutron"
        type: choice
        options:
          - Neutron
      kernel_branch:
        description: "Select kernel branch to build"
        required: true
        default: "6.6-sd"
        type: choice
        options:
          - 6.6-lts
      build_stock:
        description: 'Build stock kernel'
        required: false
        default: false
        type: boolean
      github_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: 'Asia/Jakarta'
  KERNEL_REPO: https://github.com/Artecxyz/RedPanda-kernels.git
  KERNEL_DEFCONFIG: redpanda_defconfig
  KBUILD_BUILD_USER: ArtecX
  KBUILD_BUILD_HOST: xyz

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      # - name: 🧠 Add swap space (for LTO link)
      #   run: |
      #     sudo fallocate -l 16G /mnt/swap_lto || sudo dd if=/dev/zero of=/mnt/swap_lto bs=1M count=16384
      #     sudo chmod 600 /mnt/swap_lto
      #     sudo mkswap /mnt/swap_lto
      #     sudo swapon /mnt/swap_lto
      #     echo "── swap after ──"; free -h
          
      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: ⚙️ Configure CCache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.kernel_branch }}" >> $GITHUB_ENV
          # echo "LDCACHE_DIR=$GITHUB_WORKSPACE/ldcache_${{ github.event.inputs.kernel_branch }}" >> $GITHUB_ENV
          # mkdir -p "$HOME/ldcache_${{ github.event.inputs.kernel_branch }}"
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.kernel_branch }}"
          
      - name: "📦 Cache & Install Dependencies"
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts: true
          
      - name: Clone kernel source
        run: |
          git clone --depth=1 "$KERNEL_REPO" -b "${{ github.event.inputs.kernel_branch }}" "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: toolchains/clang
          key: clang-${{ github.event.inputs.clang_choice }}

      - name: Download & Setup Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          cd "$GITHUB_WORKSPACE/toolchains/clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Show Clang version
        run: |
          echo "=== Clang version ==="
          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version
          echo "=== LLVM/ld.lld version ==="
          "$GITHUB_WORKSPACE/toolchains/clang/bin/ld.lld" --version || true

      - name: Restore Ccache
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.build_variant }}-${{ github.event.inputs.clang_choice }}-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.build_variant }}-${{ github.event.inputs.clang_choice }}-${{ github.event.inputs.kernel_branch }}-
            
      # - name: Restore LTO Cache
      #   uses: actions/cache/restore@v6
      #   with:
      #     path: ${{ env.LDCACHE_DIR }}
      #     key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      #     restore-keys: |
      #       lto-cache-${{ runner.os }}-${{ github.ref_name }}-
            
      - name: Initialize Ccache
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache initialization complete"
            else
              echo "✅ ccache already initialized, skipping."
            fi
          else
            echo "❌ ccache not installed, skipping."
          fi
          ccache -s
          
      - name: Build kernel (stock)
        if: github.event.inputs.build_stock == 'true' || github.event.inputs.build_variant == 'none'
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_COMPILER_STRING="$($GITHUB_WORKSPACE/toolchains/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
          cd kernel_workspace
          OUT_DIR="out-stock"

          DEFCONFIG="arch/arm64/configs/$KERNEL_DEFCONFIG"
          sed -i "s/^CONFIG_LTO_NONE=y/CONFIG_LTO_CLANG_THIN=y/" "$DEFCONFIG"
          sed -i "/^# CONFIG_LTO_CLANG_THIN is not set/d" "$DEFCONFIG"
          printf "\nCONFIG_LTO=y\nCONFIG_LTO_CLANG=y\n" >> "$DEFCONFIG"

          make O="$OUT_DIR" CC="ccache clang" HOSTCC="ccache gcc" LLVM=1 LLVM_IAS=1 LTO=thin KCFLAGS="-w" KBUILD_BUILD_USER=$KBUILD_BUILD_USER KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST $KERNEL_DEFCONFIG
          make -j$(nproc --all) O="$OUT_DIR" CC="ccache clang" HOSTCC="ccache gcc" LLVM=1 LLVM_IAS=1 LTO=thin KCFLAGS="-w" KBUILD_BUILD_USER=$KBUILD_BUILD_USER KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST
          ccache -s

      - name: 📦 Package stock build into AnyKernel zip
        if: github.event.inputs.build_stock == 'true' || github.event.inputs.build_variant == 'none'
        run: |
          cd kernel_workspace
          git clone --depth=1 https://github.com/Artecxyz/AnyKernel3.git
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../out-stock/arch/arm64/boot/Image ./Image
          if [ ! -f ./Image ]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          ZIP_NAME=RedPanda-GKI-Stock-$(date +%Y%m%d-%H%M).zip
          zip -r9 "../$ZIP_NAME" ./*

      - name: 📤 Upload stock zip artifact
        if: (github.event.inputs.build_stock == 'true' || github.event.inputs.build_variant == 'none') && github.event.inputs.github_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RedPanda-GKI-Stock
          path: kernel_workspace/RedPanda-GKI-Stock-*.zip
          retention-days: 7

      - name: ⚡ Setup ReSukiSU
        if: github.event.inputs.build_variant != 'none'
        run: |
          set -euo pipefail
          cd kernel_workspace
          [ -d "common" ] && cd common
          echo "🛠️ Setting up ReSukiSU (main)..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 30700)
          echo "KSUVER=$KSUVER" >> $GITHUB_ENV
          echo "✅ ReSukiSU $(git rev-parse --short HEAD) (ver $KSUVER)"

      - name: 🔧 Setup Patches
        if: github.event.inputs.build_variant != 'none'
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 "$GITHUB_WORKSPACE/susfs4ksu"
          cd kernel_workspace
          [ -d "common" ] && cd common
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/"* ./fs/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/"* ./include/linux/
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" .

          # nr_subpages
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' \
              -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
          fi
          # base.c dma-buf
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          # memory.c zswap
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            sed -i '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          # task_mmu last_vma_end: expand ONLY if unbraced (your tree is already braced → skipped)
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c \
             && ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
          fi

          echo "📦 Applying 50_ with --forward (by-design rejects skip cleanly)..."
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true

          # Verify the SUS_MAP guard actually landed (real correctness check, not error-ignoring)
          grep -q "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" fs/proc/task_mmu.c \
            || { echo "❌ SUS_MAP guard missing — real failure"; exit 1; }
            
          echo "✅ SUSFS setup complete"

      - name: ⚙️ Configure Kernel Options
        if: github.event.inputs.build_variant != 'none'
        run: |
          cd kernel_workspace
          [ -d "common" ] && cd common

          DEFCONFIG="arch/arm64/configs/$KERNEL_DEFCONFIG"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found"
            exit 1
          fi

          set_config() {
            local key="$1"
            local value="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=${value}" >> "$DEFCONFIG"
          }
          
          set_config CONFIG_KSU y
          set_config CONFIG_KALLSYMS y
          set_config CONFIG_KALLSYMS_ALL y
          set_config CONFIG_KSU_FULL_NAME_FORMAT "v%KSU_VERSION%-%COMMIT_SHA%@artecxyz"
          
          set_config CONFIG_HEADERS_INSTALL n
          set_config CONFIG_LLVM_POLLY y
          set_config CONFIG_LD_DEAD_CODE_DATA_ELIMINATION y
          
          sed -i "/^CONFIG_LTO_NONE=y/d;/^# CONFIG_LTO_NONE is not set/d" "$DEFCONFIG"
          set_config CONFIG_LTO_CLANG_THIN y

          set_config CONFIG_KSU_SUSFS y
          set_config CONFIG_KSU_SUSFS_SUS_PATH y
          set_config CONFIG_KSU_SUSFS_SUS_MOUNT y
          set_config CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
          set_config CONFIG_KSU_SUSFS_ENABLE_LOG y
          set_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          set_config CONFIG_KSU_SUSFS_SUS_MAP y

          ed -i 's/check_defconfig//' ./build.config.gki 2>/dev/null || true
          echo "Kernel configs enabled in $KERNEL_DEFCONFIG"

      - name: Build kernel (KernelSU+SUSFS)
        if: github.event.inputs.build_variant != 'none'
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_COMPILER_STRING="$($GITHUB_WORKSPACE/toolchains/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
          cd kernel_workspace
          OUT_DIR="out-ksu-susfs"

          # # LTO thin cache wrapper pointing to RAM disk
          # echo '#!/bin/bash' > ld-wrapper
          # echo 'ld.lld "$@" --thinlto-cache-dir=$GITHUB_WORKSPACE/ldcache_${{ github.event.inputs.kernel_branch }} --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          # chmod +x ld-wrapper
          
          make -j$(nproc --all) O="$OUT_DIR" CC="ccache clang" HOSTCC="ccache gcc" LLVM=1 LLVM_IAS=1 LTO=thin KCFLAGS="-w" KBUILD_BUILD_USER=$KBUILD_BUILD_USER KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST $KERNEL_DEFCONFIG
          make -j$(nproc --all) O="$OUT_DIR" CC="ccache clang" HOSTCC="ccache gcc" LLVM=1 LLVM_IAS=1 LTO=thin KCFLAGS="-w" KBUILD_BUILD_USER=$KBUILD_BUILD_USER KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST
          ccache -s

      - name: 📦 Make AnyKernel3 (KernelSU+SUSFS)
        if: github.event.inputs.build_variant != 'none'
        run: |
          cd kernel_workspace
          git clone --depth=1 https://github.com/Artecxyz/AnyKernel3.git
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../out-ksu-susfs/arch/arm64/boot/Image ./Image
          if [ ! -f ./Image ]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          ZIP_NAME=RedPanda-GKI-${{ github.event.inputs.build_variant }}-$(date +%Y%m%d-%H%M).zip
          zip -r9 "../$ZIP_NAME" ./*

      - name: 📤 Upload zip artifact (KernelSU+SUSFS)
        if: github.event.inputs.build_variant != 'none' && github.event.inputs.github_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RedPanda-GKI-${{ github.event.inputs.build_variant }}
          path: kernel_workspace/RedPanda-GKI-${{ github.event.inputs.build_variant }}-*.zip
          retention-days: 7

      - name: 📤 Upload to GitHub Release
        if: github.event.inputs.github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RedPanda-GKI-v${{ github.run_number }}
          name: RedPanda GKI Build #${{ github.run_number }}
          files: kernel_workspace/*.zip

      - name: Save Ccache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.build_variant }}-${{ github.event.inputs.clang_choice }}-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}

      # - name: 📦 Save LTO CCache
      #   uses: actions/cache/save@v6
      #   with:
      #     path: ${{ env.LDCACHE_DIR }}
      #     key: lto-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
